name: Build & Publish Docker image

# Baut das Docker-Image, veröffentlicht es auf GitHub Container Registry
# (ghcr.io) und hängt es optional an GitHub-Releases als Asset.
# Tags:
#   - Bei jedem Push auf main  → ghcr.io/<owner>/stantonopoly-multiplayer:latest
#   - Bei Tags (git tag v2.1.0) → ghcr.io/<owner>/stantonopoly-multiplayer:v2.1.0
#     (GitHub setzt für Tag-Pushes automatisch eine GitHub-Release-Seite ohne Asset;
#      das Docker-Image kommt als Arbeitsartefakt bzw. über die GHCR-SHA frei.)

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:          # manueller Build aus der Actions-Seite

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # = SeBoOne/Stantonopoly-v2 → ghcr.io/seboone/stantonopoly-v2

# WICHTIG: GHCR-Push braucht explizite Berechtigung. Ohne `packages: write`
# erhält der GITHUB_TOKEN im Workflow nur `contents: read` → docker login gelingt,
# aber `docker push` scheitert mit "permission_denied: token does not match scopes".
# (Genau das schlug Run 36753607868.)
permissions:
  contents: read          # zum Auschecken des Repos
  packages: write         # zum Pushen des Images nach ghcr.io
  id-token: write         # für OIDC (kann später für GHCR-Trust genutzt werden)

jobs:
  build-and-test:
    name: Install, testen, Image bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Testsuite ausführen (ohne die präexistenten Teardown-Hang-Dateien)
        run: npm run test:ci

      - name: Login an GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten für Image-Tags erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Docker-Image bauen & nach GHCR pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Nur Cache-Import (lesen) — KEIN cache-to: der Standard-docker-Driver auf
          # GitHub-Runnern unterstützt type=gha nur mit containerd image store, sonst
          # schlägt der Export fehl mit "Cache export is not supported for the docker
          # driver" (Run 36753607868). Import bleibt harmlos.
          cache-from: type=gha,scope=${{ github.ref_name }}
          platforms: linux/amd64